<mat-card class="page-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>payments</mat-icon>
    <mat-card-title>Payments</mat-card-title>
    <mat-card-subtitle>{{ isAdmin() ? 'All payments' : 'My payments' }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <!-- Loading -->
    <div *ngIf="loading()" class="spinner-wrap">
      <mat-spinner diameter="40" />
    </div>

    <!-- Table -->
    <div *ngIf="!loading()" class="table-wrap">
      <table mat-table [dataSource]="payments()" class="full-width">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <ng-container matColumnDef="bookingId">
          <th mat-header-cell *matHeaderCellDef>Booking</th>
          <td mat-cell *matCellDef="let row">#{{ row.bookingId }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Amount</th>
          <td mat-cell *matCellDef="let row">{{ row.amount | currency:'INR':'symbol':'1.2-2' }}</td>
        </ng-container>

        <ng-container matColumnDef="paymentDate">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let row">{{ row.paymentDate | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <mat-chip [color]="statusColorMap[row.status] || ''" highlighted>{{ row.status }}</mat-chip>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <p *ngIf="payments().length === 0" class="empty-msg">No payments found.</p>
    </div>
  </mat-card-content>
</mat-card>
