<div class="unauthorized-container">
  <mat-card class="unauthorized-card">
    <mat-card-content>
      <mat-icon class="lock-icon" color="warn">lock</mat-icon>
      <h2>Access Denied</h2>
      <p>You don't have permission to view this page.</p>
      <div class="actions">
        <a mat-raised-button color="primary" routerLink="/">Go to Dashboard</a>
        <a mat-button routerLink="/login">Sign in with a different account</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
