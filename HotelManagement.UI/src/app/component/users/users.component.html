<div class="page-container">
  <div class="page-header">
    <h2><mat-icon>manage_accounts</mat-icon> Users</h2>
  </div>
  @if (loading()) { <div class="center"><mat-spinner></mat-spinner></div> }
  @if (!loading()) {
    <mat-card>
      <table mat-table [dataSource]="users()" class="full-width">
        <ng-container matColumnDef="userName">
          <th mat-header-cell *matHeaderCellDef>Username</th>
          <td mat-cell *matCellDef="let u">{{ u.userName }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>
        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Roles</th>
          <td mat-cell *matCellDef="let u">
            <div class="chips-row">
              @for (role of u.roles; track role) {
                <mat-chip (removed)="removeRole(u.id, role)">
                  {{ role }}
                  <button matChipRemove><mat-icon>cancel</mat-icon></button>
                </mat-chip>
              }
            </div>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Assign Role</th>
          <td mat-cell *matCellDef="let u">
            @for (role of allRoles; track role) {
              @if (!u.roles?.includes(role)) {
                <button mat-stroked-button class="role-btn" (click)="addRole(u.id, role)">+ {{ role }}</button>
              }
            }
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card>
  }
</div>
