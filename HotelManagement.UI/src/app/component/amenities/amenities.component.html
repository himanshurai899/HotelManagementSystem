<div class="page-container">
  <div class="page-header">
    <h2><mat-icon>spa</mat-icon> Amenities</h2>
    <button mat-raised-button color="primary" (click)="openForm()"><mat-icon>add</mat-icon> Add Amenity</button>
  </div>
  @if (loading()) { <div class="center"><mat-spinner></mat-spinner></div> }
  @if (!loading()) {
    <mat-card>
      <table mat-table [dataSource]="items()" class="full-width">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let r">{{ r.name }}</td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let r">{{ r.description }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button (click)="openForm(r)"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(r.id)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card>
  }
  @if (showForm()) {
    <mat-card class="form-card">
      <mat-card-header><mat-card-title>{{ editId() ? 'Edit' : 'Add' }} Amenity</mat-card-title></mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
          <mat-form-field appearance="outline"><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Description</mat-label><input matInput formControlName="description" /></mat-form-field>
          <div class="form-actions">
            <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
            <button mat-button type="button" (click)="showForm.set(false)">Cancel</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  }
</div>
